# Ruff starts from the rules that catch defects rather than taste.
#
# pyflakes (F) finds undefined names, unused imports and shadowing; the E4/E7/E9
# subset catches syntax-level mistakes such as imports after code or a stray
# semicolon. Style rules are deliberately not enabled here: turning on a large
# rule set on day one produces a gate people learn to ignore.

target-version = "py311"
line-length = 120

exclude = [".venv", "tmp", ".tools"]

[lint]
select = ["E4", "E7", "E9", "F"]
