<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.bluePanel{fill:#f5f9ff;stroke:#c9d7e9;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.redCard{fill:#fff8f6;stroke:#e6cbc4}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 17px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 15px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1280"/>
  <rect class="bluePanel shadow" x="40" y="34" width="1840" height="120" rx="24"/>
  <text class="title" x="640" y="108">在线 Skills 评测流程图</text>
  <text class="small" x="520" y="138">从审计数据到 replay、规则、candidate 试跑、状态与产物的完整流转</text>

  <rect class="panel shadow" x="70" y="200" width="1780" height="210" rx="22"/>
  <text class="section" x="120" y="250">第一段：入口与数据读取</text>
  <rect class="card greenCard" x="120" y="285" width="250" height="90" rx="18"/>
  <text class="label" x="160" y="322">/skill-eval</text>
  <text class="small" x="142" y="352">REPL 异步评测入口</text>
  <rect class="card blueCard" x="455" y="285" width="250" height="90" rx="18"/>
  <text class="label" x="500" y="322">side_query</text>
  <text class="small" x="480" y="352">可选 LLM judge</text>
  <rect class="card orangeCard" x="790" y="285" width="250" height="90" rx="18"/>
  <text class="label" x="840" y="322">审计数据</text>
  <text class="small" x="820" y="352">provenance / usage</text>
  <rect class="card purpleCard" x="1125" y="285" width="250" height="90" rx="18"/>
  <text class="label" x="1188" y="322">SKILL.md</text>
  <text class="small" x="1160" y="352">active Skill 快照</text>
  <rect class="card blueCard" x="1460" y="285" width="250" height="90" rx="18"/>
  <text class="label" x="1510" y="322">原始输入集</text>
  <text class="small" x="1498" y="352">进入评测核心流程</text>
  <path class="gline" d="M370 330H455"/>
  <path class="line" d="M705 330H790"/>
  <path class="line" d="M1040 330H1125"/>
  <path class="line" d="M1375 330H1460"/>

  <rect class="panel shadow" x="70" y="455" width="1780" height="280" rx="22"/>
  <text class="section" x="120" y="505">第二段：Lineage 与 Replay 样本池</text>
  <rect class="card greenCard" x="120" y="540" width="250" height="115" rx="18"/>
  <text class="label" x="158" y="582">Lineage 聚合</text>
  <text class="small" x="146" y="615">按 Skill 名称合并证据</text>
  <rect class="card blueCard" x="455" y="540" width="250" height="115" rx="18"/>
  <text class="label" x="498" y="582">Replay 构造</text>
  <text class="small" x="480" y="615">抽取历史对话窗口</text>
  <rect class="card orangeCard" x="790" y="540" width="250" height="115" rx="18"/>
  <text class="label" x="838" y="582">样本去重</text>
  <text class="small" x="820" y="615">按 sample_id 合并</text>
  <rect class="card purpleCard" x="1125" y="540" width="250" height="115" rx="18"/>
  <text class="label" x="1170" y="582">Frozen Pool</text>
  <text class="small" x="1152" y="615">写 replay_pool.jsonl</text>
  <rect class="card greenCard" x="1460" y="540" width="250" height="115" rx="18"/>
  <text class="label" x="1516" y="582">Split</text>
  <text class="small" x="1488" y="615">mutate_dev / test</text>
  <path class="line" d="M370 597H455"/>
  <path class="line" d="M705 597H790"/>
  <path class="line" d="M1040 597H1125"/>
  <path class="line" d="M1375 597H1460"/>

  <rect class="panel shadow" x="70" y="780" width="1780" height="250" rx="22"/>
  <text class="section" x="120" y="830">第三段：规则评判与候选试跑</text>
  <rect class="card purpleCard" x="120" y="865" width="260" height="105" rx="18"/>
  <text class="label" x="165" y="905">Rule Compiler</text>
  <text class="small" x="148" y="935">从 Skill 文本生成规则</text>
  <rect class="card greenCard" x="465" y="865" width="260" height="105" rx="18"/>
  <text class="label" x="512" y="905">Programmatic</text>
  <text class="small" x="500" y="935">格式 / 结构本地检查</text>
  <rect class="card blueCard" x="810" y="865" width="260" height="105" rx="18"/>
  <text class="label" x="862" y="905">LLM Judge</text>
  <text class="small" x="842" y="935">pass / reason 二元判断</text>
  <rect class="card orangeCard" x="1155" y="865" width="260" height="105" rx="18"/>
  <text class="label" x="1182" y="905">Candidate Variants</text>
  <text class="small" x="1182" y="935">失败规则生成候选</text>
  <rect class="card redCard" x="1500" y="865" width="260" height="105" rx="18"/>
  <text class="label" x="1530" y="905">Candidate Eval</text>
  <text class="small" x="1522" y="935">重放生成回复并评测</text>
  <path class="line" d="M380 917H465"/>
  <path class="line" d="M725 917H810"/>
  <path class="line" d="M1070 917H1155"/>
  <path class="line" d="M1415 917H1500"/>

  <rect class="bluePanel shadow" x="70" y="1075" width="1780" height="140" rx="22"/>
  <text class="section" x="120" y="1125">第四段：门控与产物</text>
  <text class="small" x="235" y="1124">Rule Summary + Candidate Summary + Usage Stats -> Status Gate -> Champion Promotion -> eval_spec / outputs / judgments / summary / report</text>
  <path class="gline" d="M780 1162H1150"/>
  <text class="muted" x="625" y="1195">candidate 和 champion 只写评测产物，不自动覆盖 active Skill 文件</text>
</svg>
