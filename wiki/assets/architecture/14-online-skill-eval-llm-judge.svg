<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.bluePanel{fill:#f5f9ff;stroke:#c9d7e9;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.redCard{fill:#fff8f6;stroke:#e6cbc4}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 24px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1280"/>
  <rect class="bluePanel shadow" x="40" y="34" width="1840" height="120" rx="24"/>
  <text class="title" x="650" y="108">在线 Skills 评测架构</text>
  <text class="small" x="500" y="138">入口分流 · Frozen Replay · Rules/Judge · Candidate Variants · Usage Gate · Champion</text>

  <rect class="panel shadow" x="60" y="210" width="360" height="790" rx="22"/>
  <text class="section" x="168" y="260">评测入口</text>
  <rect class="card greenCard" x="100" y="310" width="280" height="110" rx="18"/>
  <text class="label" x="164" y="352">/skill-eval</text>
  <text class="small" x="124" y="386">REPL 异步入口</text>
  <rect class="card blueCard" x="100" y="455" width="280" height="110" rx="18"/>
  <text class="label" x="158" y="497">side_query</text>
  <text class="small" x="126" y="531">提供 LLM judge</text>
  <rect class="card orangeCard" x="100" y="600" width="280" height="110" rx="18"/>
  <text class="label" x="150" y="642">模块运行</text>
  <text class="small" x="116" y="676">python -m agents.online_skill_eval</text>
  <rect class="card purpleCard" x="100" y="745" width="280" height="110" rx="18"/>
  <text class="label" x="158" y="787">同步 API</text>
  <text class="small" x="116" y="821">纯程序化规则 fallback</text>

  <rect class="panel shadow" x="500" y="210" width="380" height="790" rx="22"/>
  <text class="section" x="610" y="260">输入数据</text>
  <rect class="card blueCard" x="540" y="310" width="300" height="105" rx="18"/>
  <text class="label" x="582" y="352">online_provenance</text>
  <text class="small" x="574" y="386">在线沉淀原始事件</text>
  <rect class="card blueCard" x="540" y="450" width="300" height="105" rx="18"/>
  <text class="label" x="572" y="492">skill_provenance</text>
  <text class="small" x="578" y="526">按 Skill 聚合来源</text>
  <rect class="card orangeCard" x="540" y="590" width="300" height="105" rx="18"/>
  <text class="label" x="584" y="632">usage_stats</text>
  <text class="small" x="570" y="666">retrieved / relevant / used</text>
  <rect class="card purpleCard" x="540" y="730" width="300" height="105" rx="18"/>
  <text class="label" x="600" y="772">Active Skills</text>
  <text class="small" x="574" y="806">当前 SKILL.md 快照</text>

  <rect class="panel shadow" x="960" y="210" width="430" height="790" rx="22"/>
  <text class="section" x="1102" y="260">评测引擎</text>
  <rect class="card greenCard" x="1005" y="305" width="340" height="90" rx="18"/>
  <text class="label" x="1082" y="342">Lineage 聚合</text>
  <text class="small" x="1064" y="372">按 Skill 名称收敛证据</text>
  <rect class="card greenCard" x="1005" y="425" width="340" height="90" rx="18"/>
  <text class="label" x="1072" y="462">Replay Builder</text>
  <text class="small" x="1058" y="492">固化 replay_pool.jsonl</text>
  <rect class="card purpleCard" x="1005" y="545" width="340" height="90" rx="18"/>
  <text class="label" x="1075" y="582">Rule Compiler</text>
  <text class="small" x="1042" y="612">programmatic / llm_binary</text>
  <rect class="card purpleCard" x="1005" y="665" width="340" height="90" rx="18"/>
  <text class="label" x="1088" y="702">Rule Engine</text>
  <text class="small" x="1038" y="732">历史回复 + candidate 回复评测</text>
  <rect class="card orangeCard" x="1005" y="785" width="340" height="90" rx="18"/>
  <text class="label" x="1054" y="822">Candidate Variants</text>
  <text class="small" x="1040" y="852">失败规则驱动候选试跑</text>
  <rect class="card redCard" x="1005" y="905" width="340" height="70" rx="18"/>
  <text class="label" x="1068" y="948">Usage + Champion</text>

  <rect class="panel shadow" x="1480" y="210" width="380" height="790" rx="22"/>
  <text class="section" x="1592" y="260">输出产物</text>
  <rect class="card greenCard" x="1520" y="310" width="300" height="95" rx="18"/>
  <text class="label" x="1588" y="350">Replay Pool</text>
  <text class="small" x="1548" y="380">datasets/replay_pool.jsonl</text>
  <rect class="card purpleCard" x="1520" y="438" width="300" height="95" rx="18"/>
  <text class="label" x="1590" y="478">Eval Spec</text>
  <text class="small" x="1560" y="508">evals/eval_spec.json</text>
  <rect class="card orangeCard" x="1520" y="566" width="300" height="95" rx="18"/>
  <text class="label" x="1590" y="606">Run Files</text>
  <text class="small" x="1538" y="636">outputs / judgments / summary</text>
  <rect class="card redCard" x="1520" y="694" width="300" height="95" rx="18"/>
  <text class="label" x="1580" y="734">Champion</text>
  <text class="small" x="1536" y="764">champions.json / SKILL.md</text>
  <rect class="card blueCard" x="1520" y="822" width="300" height="95" rx="18"/>
  <text class="label" x="1590" y="862">Report</text>
  <text class="small" x="1538" y="892">online_eval_report.json</text>

  <path class="gline" d="M380 365H500"/>
  <path class="line" d="M380 510H500"/>
  <path class="line" d="M380 655H500"/>
  <path class="line" d="M880 572H960"/>
  <path class="line" d="M1175 395V425"/>
  <path class="line" d="M1175 515V545"/>
  <path class="line" d="M1175 635V665"/>
  <path class="line" d="M1175 755V785"/>
  <path class="line" d="M1175 875V905"/>
  <path class="line" d="M1390 650H1480"/>

  <rect class="bluePanel shadow" x="160" y="1060" width="1600" height="140" rx="22"/>
  <text class="section" x="812" y="1110">评测边界</text>
  <text class="small" x="248" y="1156">LLM judge 判断规则；candidate 会生成 replay 回复试跑；评测写 champion 产物，但不自动覆盖 active SKILL.md。</text>
</svg>
