<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.bluePanel{fill:#f5f9ff;stroke:#c9d7e9;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.redCard{fill:#fff8f6;stroke:#e6cbc4}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 24px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.green{fill:#14945b}.blue{fill:#3165b7}.orange{fill:#f47d22}.purple{fill:#6045a9}.red{fill:#d34a42}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1280"/>
  <rect class="bluePanel shadow" x="40" y="34" width="1840" height="120" rx="24"/>
  <text class="title" x="610" y="108">mawoagent 总体架构</text>
  <text class="small" x="620" y="138">Agentic Harness · 自进化 Skills · Memory · MCP · 子 Agent</text>

  <rect class="panel shadow" x="60" y="210" width="360" height="760" rx="22"/>
  <text class="section" x="148" y="260">用户入口</text>
  <rect class="card blueCard" x="100" y="310" width="280" height="120" rx="18"/>
  <text class="label" x="150" y="358">CLI / REPL</text><text class="small" x="142" y="392">python3 -m agents.main</text>
  <rect class="card blueCard" x="100" y="470" width="280" height="120" rx="18"/>
  <text class="label" x="150" y="518">One-shot</text><text class="small" x="132" y="552">一次性任务执行</text>
  <rect class="card blueCard" x="100" y="630" width="280" height="120" rx="18"/>
  <text class="label" x="150" y="678">REPL 命令</text><text class="small" x="132" y="712">/skills /extract_now</text>

  <rect class="panel shadow" x="520" y="210" width="860" height="760" rx="22"/>
  <text class="section" x="814" y="260">Agent Runtime</text>
  <rect class="card greenCard" x="600" y="310" width="280" height="116" rx="18"/>
  <text class="label" x="666" y="358">Agent Loop</text><text class="small" x="638" y="392">agents/agent.py</text>
  <rect class="card greenCard" x="1020" y="310" width="280" height="116" rx="18"/>
  <text class="label" x="1080" y="358">Prompt 构建</text><text class="small" x="1070" y="392">prompt.py</text>
  <rect class="card orangeCard" x="600" y="500" width="280" height="116" rx="18"/>
  <text class="label" x="670" y="548">工具系统</text><text class="small" x="640" y="582">tools.py / 权限</text>
  <rect class="card orangeCard" x="1020" y="500" width="280" height="116" rx="18"/>
  <text class="label" x="1080" y="548">模型接口</text><text class="small" x="1044" y="582">OpenAI / Anthropic</text>
  <rect class="card purpleCard" x="600" y="690" width="280" height="116" rx="18"/>
  <text class="label" x="672" y="738">Skills</text><text class="small" x="630" y="772">加载 / 检索 / 调用</text>
  <rect class="card purpleCard" x="1020" y="690" width="280" height="116" rx="18"/>
  <text class="label" x="1060" y="738">自进化链路</text><text class="small" x="1048" y="772">online_ingest</text>
  <path class="gline" d="M420 590H560"/><path class="line" d="M880 368H1020"/><path class="line" d="M740 426V500"/><path class="line" d="M1160 426V500"/><path class="line" d="M740 616V690"/><path class="line" d="M1160 616V690"/>

  <rect class="panel shadow" x="1480" y="210" width="360" height="760" rx="22"/>
  <text class="section" x="1566" y="260">外部与存储</text>
  <rect class="card greenCard" x="1520" y="310" width="280" height="105" rx="18"/><text class="label" x="1588" y="352">Memory</text><text class="small" x="1555" y="386">~/.mawoagent</text>
  <rect class="card purpleCard" x="1520" y="450" width="280" height="105" rx="18"/><text class="label" x="1588" y="492">Skills</text><text class="small" x="1548" y="526">.mawoagent/skills</text>
  <rect class="card orangeCard" x="1520" y="590" width="280" height="105" rx="18"/><text class="label" x="1588" y="632">MCP</text><text class="small" x="1542" y="666">外部工具 Server</text>
  <rect class="card blueCard" x="1520" y="730" width="280" height="105" rx="18"/><text class="label" x="1588" y="772">Session</text><text class="small" x="1548" y="806">~/.mawoagent</text>
  <path class="line" d="M1380 368H1480"/><path class="line" d="M1380 748H1480"/><path class="line" d="M1380 558H1480"/><path class="line" d="M1380 642H1480"/>

  <rect class="bluePanel shadow" x="160" y="1040" width="1600" height="150" rx="22"/>
  <text class="section" x="730" y="1092">核心价值</text>
  <text class="small" x="300" y="1140">把一次性对话经验沉淀为可复用 Skills，并通过权限、provenance、usage stats 保证自进化可控可审计。</text>
</svg>

