<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs><style>.bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.orangeCard{fill:#fff9ef;stroke:#efd7af}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 24px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.shadow{filter:url(#shadow)}</style><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker></defs>
  <rect class="bg" width="1920" height="1280"/>
  <text class="title" x="690" y="90">本地与 Docker 部署结构</text>
  <rect class="panel shadow" x="90" y="170" width="800" height="820" rx="24"/>
  <text class="section" x="390" y="230">本地运行</text>
  <rect class="card blueCard" x="180" y="300" width="620" height="120" rx="20"/><text class="label" x="392" y="350">Python 3.11+</text><text class="small" x="332" y="386">venv + requirements.txt</text>
  <rect class="card greenCard" x="180" y="470" width="620" height="120" rx="20"/><text class="label" x="408" y="520">.env</text><text class="small" x="320" y="556">OpenAI / Anthropic API</text>
  <rect class="card orangeCard" x="180" y="640" width="620" height="120" rx="20"/><text class="label" x="350" y="690">python3 -m agents.main</text><text class="small" x="350" y="726">REPL / one-shot / --plan</text>

  <rect class="panel shadow" x="1030" y="170" width="800" height="820" rx="24"/>
  <text class="section" x="1310" y="230">Docker 运行</text>
  <rect class="card blueCard" x="1120" y="300" width="620" height="120" rx="20"/><text class="label" x="1330" y="350">Dockerfile</text><text class="small" x="1240" y="386">python:3.11-slim + Node 22</text>
  <rect class="card greenCard" x="1120" y="470" width="620" height="120" rx="20"/><text class="label" x="1318" y="520">Volume</text><text class="small" x="1236" y="556">/workspace + ~/.mawoagent + ~/.mawoagent</text>
  <rect class="card orangeCard" x="1120" y="640" width="620" height="120" rx="20"/><text class="label" x="1290" y="690">--accept-edits</text><text class="small" x="1248" y="726">允许后台自动沉淀 Skills</text>
  <path class="line" d="M800 700H1120"/>
  <rect class="card" x="380" y="1060" width="1160" height="110" rx="20"/>
  <text class="section" x="740" y="1106">关键配置</text>
  <text class="small" x="520" y="1144">MAWOAGENT_AUTO_SKILL_EVOLUTION=1 · MAWOAGENT_AUTO_SKILL_TARGET=project · MODEL</text>
</svg>

