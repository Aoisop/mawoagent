<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.bluePanel{fill:#f5f9ff;stroke:#c9d7e9;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 24px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.blue{fill:#3165b7}.green{fill:#14945b}.orange{fill:#f47d22}.purple{fill:#6045a9}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <rect class="bluePanel shadow" x="70" y="50" width="1780" height="118" rx="24"/>
  <text class="title" x="690" y="116">mawoagent 学习路线</text>
  <text class="small" x="610" y="148">先跑通，再读主链路，再拆子系统，最后做扩展实验</text>

  <rect class="panel shadow" x="90" y="230" width="1740" height="640" rx="24"/>

  <g transform="translate(150,310)">
    <rect class="card blueCard" width="300" height="210" rx="18"/>
    <circle class="blue" cx="48" cy="48" r="24"/>
    <text class="label" x="90" y="56">第一阶段：跑通</text>
    <text class="small" x="38" y="104">安装依赖、配置 API、运行 REPL</text>
    <text class="muted" x="38" y="142">重点文件：README、完整使用指南</text>
    <text class="muted" x="38" y="176">目标：知道项目能做什么</text>
  </g>

  <g transform="translate(560,310)">
    <rect class="card greenCard" width="300" height="210" rx="18"/>
    <circle class="green" cx="48" cy="48" r="24"/>
    <text class="label" x="90" y="56">第二阶段：主链路</text>
    <text class="small" x="38" y="104">从 main.py 读到 Agent.chat</text>
    <text class="muted" x="38" y="142">重点文件：main.py、agent.py</text>
    <text class="muted" x="38" y="176">目标：理解 Agent Loop</text>
  </g>

  <g transform="translate(970,310)">
    <rect class="card orangeCard" width="300" height="210" rx="18"/>
    <circle class="orange" cx="48" cy="48" r="24"/>
    <text class="label" x="90" y="56">第三阶段：子系统</text>
    <text class="small" x="38" y="104">工具、权限、Skills、Memory、MCP</text>
    <text class="muted" x="38" y="142">重点文件：tools、skills、memory</text>
    <text class="muted" x="38" y="176">目标：看懂每个能力边界</text>
  </g>

  <g transform="translate(1380,310)">
    <rect class="card purpleCard" width="300" height="210" rx="18"/>
    <circle class="purple" cx="48" cy="48" r="24"/>
    <text class="label" x="90" y="56">第四阶段：扩展</text>
    <text class="small" x="38" y="104">新增工具、Skill、Agent、MCP</text>
    <text class="muted" x="38" y="142">重点文件：扩展点和审计产物</text>
    <text class="muted" x="38" y="176">目标：能独立二次开发</text>
  </g>

  <path class="gline" d="M450 415H560"/>
  <path class="gline" d="M860 415H970"/>
  <path class="gline" d="M1270 415H1380"/>

  <rect class="card" x="270" y="650" width="1380" height="120" rx="18"/>
  <text class="section" x="790" y="700">学习原则</text>
  <text class="small" x="380" y="744">不要只背模块名；要沿着一次用户请求，观察它如何经过 prompt、模型、工具、权限、状态保存和经验沉淀。</text>
</svg>
