<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs><style>.bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.blue{fill:#3165b7}.green{fill:#14945b}.orange{fill:#f47d22}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.shadow{filter:url(#shadow)}</style><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker></defs>
  <rect class="bg" width="1920" height="1280"/>
  <text class="title" x="690" y="90">Agent Loop 主链路</text>
  <rect class="panel shadow" x="90" y="170" width="1740" height="860" rx="24"/>
  <g transform="translate(150,250)"><rect class="card" width="210" height="120" rx="18"/><circle class="blue" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">用户输入</text><text class="small" x="46" y="86">CLI / REPL</text></g>
  <g transform="translate(430,250)"><rect class="card" width="230" height="120" rx="18"/><circle class="green" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">上下文增强</text><text class="small" x="40" y="86">Memory + Skills</text></g>
  <g transform="translate(740,250)"><rect class="card" width="230" height="120" rx="18"/><circle class="orange" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">模型请求</text><text class="small" x="42" y="86">OpenAI / Anthropic</text></g>
  <g transform="translate(1050,250)"><rect class="card" width="230" height="120" rx="18"/><circle class="blue" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">工具调用</text><text class="small" x="50" y="86">tool call</text></g>
  <g transform="translate(1360,250)"><rect class="card" width="230" height="120" rx="18"/><circle class="green" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">权限检查</text><text class="small" x="44" y="86">plan / default</text></g>
  <g transform="translate(430,560)"><rect class="card" width="230" height="120" rx="18"/><circle class="orange" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">执行工具</text><text class="small" x="38" y="86">文件 / Shell / Skill</text></g>
  <g transform="translate(740,560)"><rect class="card" width="230" height="120" rx="18"/><circle class="blue" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">结果回写</text><text class="small" x="44" y="86">tool_result</text></g>
  <g transform="translate(1050,560)"><rect class="card" width="230" height="120" rx="18"/><circle class="green" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">继续推理</text><text class="small" x="44" y="86">直到完成</text></g>
  <g transform="translate(1360,560)"><rect class="card" width="230" height="120" rx="18"/><circle class="orange" cx="38" cy="38" r="20"/><text class="label" x="76" y="45">保存与后台</text><text class="small" x="28" y="86">session + evolution</text></g>
  <path class="line" d="M360 310H430"/><path class="line" d="M660 310H740"/><path class="line" d="M970 310H1050"/><path class="line" d="M1280 310H1360"/><path class="line" d="M1475 370V560"/><path class="line" d="M1360 620H1280"/><path class="line" d="M1050 620H970"/><path class="line" d="M740 620H660"/><path class="line" d="M855 560V370"/>
  <rect class="card" x="260" y="820" width="1400" height="110" rx="18"/>
  <text class="section" x="770" y="866">关键点</text>
  <text class="small" x="360" y="905">模型不直接操作环境；所有工具调用都由 Harness 做权限检查、执行调度、结果裁剪和上下文回写。</text>
</svg>

