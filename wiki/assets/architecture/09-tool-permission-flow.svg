<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.redCard{fill:#fff8f6;stroke:#e6cbc4}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.redline{stroke:#d34a42;stroke-width:4;fill:none;marker-end:url(#rarrow)}.blue{fill:#3165b7}.green{fill:#14945b}.orange{fill:#f47d22}.purple{fill:#6045a9}.red{fill:#d34a42}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
    <marker id="rarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d34a42"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1180"/>
  <text class="title" x="650" y="90">工具调用与权限控制流程</text>
  <rect class="panel shadow" x="80" y="150" width="1760" height="880" rx="24"/>

  <g transform="translate(150,250)"><rect class="card blueCard" width="250" height="120" rx="18"/><circle class="blue" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">模型发起</text><text class="small" x="62" y="88">tool call</text></g>
  <g transform="translate(500,250)"><rect class="card greenCard" width="260" height="120" rx="18"/><circle class="green" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">读取规则</text><text class="small" x="38" y="88">settings allow / deny</text></g>
  <g transform="translate(860,250)"><rect class="card orangeCard" width="260" height="120" rx="18"/><circle class="orange" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">判断模式</text><text class="small" x="42" y="88">plan / default / yolo</text></g>
  <g transform="translate(1220,250)"><rect class="card purpleCard" width="280" height="120" rx="18"/><circle class="purple" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">风险判断</text><text class="small" x="38" y="88">危险命令 / 新建文件</text></g>

  <path class="line" d="M400 310H500"/>
  <path class="line" d="M760 310H860"/>
  <path class="line" d="M1120 310H1220"/>

  <g transform="translate(250,540)"><rect class="card greenCard" width="280" height="130" rx="18"/><text class="label" x="92" y="46">allow</text><text class="small" x="42" y="84">执行 execute_tool</text><text class="muted" x="42" y="112">结果回写模型</text></g>
  <g transform="translate(660,540)"><rect class="card orangeCard" width="280" height="130" rx="18"/><text class="label" x="92" y="46">confirm</text><text class="small" x="42" y="84">询问用户是否允许</text><text class="muted" x="42" y="112">允许后执行，拒绝则回写拒绝</text></g>
  <g transform="translate(1070,540)"><rect class="card redCard" width="280" height="130" rx="18"/><text class="label" x="100" y="46">deny</text><text class="small" x="42" y="84">不执行工具</text><text class="muted" x="42" y="112">把拒绝原因返回模型</text></g>

  <path class="gline" d="M1340 370C1280 465 620 455 390 540"/>
  <path class="line" d="M1360 370C1340 465 820 455 800 540"/>
  <path class="redline" d="M1390 370C1435 465 1240 455 1210 540"/>

  <rect class="card" x="260" y="800" width="1400" height="120" rx="18"/>
  <text class="section" x="815" y="850">核心思想</text>
  <text class="small" x="390" y="892">模型只能提出操作意图；真正执行前必须经过 Harness 的权限、模式、读前检查和风险判断。</text>
</svg>
