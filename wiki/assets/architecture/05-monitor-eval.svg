<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs><style>.bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.redCard{fill:#fff8f6;stroke:#e6cbc4}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.line{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#arrow)}.shadow{filter:url(#shadow)}</style><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker></defs>
  <rect class="bg" width="1920" height="1280"/>
  <text class="title" x="650" y="90">自进化审计闭环</text>
  <rect class="panel shadow" x="90" y="160" width="1740" height="920" rx="24"/>
  <g transform="translate(170,260)"><rect class="card blueCard" width="300" height="160" rx="20"/><text class="label" x="86" y="58">Skill 召回</text><text class="small" x="70" y="102">retrieved hit</text></g>
  <g transform="translate(600,260)"><rect class="card greenCard" width="300" height="160" rx="20"/><text class="label" x="86" y="58">Usage Judge</text><text class="small" x="54" y="102">relevant / used</text></g>
  <g transform="translate(1030,260)"><rect class="card orangeCard" width="300" height="160" rx="20"/><text class="label" x="78" y="58">使用统计</text><text class="small" x="40" y="102">skill_usage_stats.json</text></g>
  <g transform="translate(1460,260)"><rect class="card redCard" width="300" height="160" rx="20"/><text class="label" x="78" y="58">Stale 归档</text><text class="small" x="68" y="102">pruned/</text></g>
  <g transform="translate(390,600)"><rect class="card greenCard" width="320" height="170" rx="20"/><text class="label" x="92" y="60">在线沉淀</text><text class="small" x="62" y="104">online_ingest()</text></g>
  <g transform="translate(800,600)"><rect class="card blueCard" width="320" height="170" rx="20"/><text class="label" x="98" y="60">来源日志</text><text class="small" x="38" y="104">online_provenance.jsonl</text></g>
  <g transform="translate(1210,600)"><rect class="card orangeCard" width="320" height="170" rx="20"/><text class="label" x="98" y="60">聚合索引</text><text class="small" x="30" y="104">online_skill_provenance.json</text></g>
  <g transform="translate(760,860)"><rect class="card greenCard" width="400" height="130" rx="20"/><text class="label" x="128" y="54">可追溯结论</text><text class="small" x="66" y="90">这个 Skill 从哪段对话沉淀而来</text></g>
  <path class="line" d="M470 340H600"/><path class="line" d="M900 340H1030"/><path class="line" d="M1330 340H1460"/><path class="line" d="M710 685H800"/><path class="line" d="M1120 685H1210"/><path class="line" d="M1370 770V900H1160"/><path class="line" d="M960 770V860"/>
  <text class="section" x="575" y="1040">自进化能力必须可观察、可解释、可回溯</text>
</svg>

