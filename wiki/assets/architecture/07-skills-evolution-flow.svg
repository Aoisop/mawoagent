<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.bluePanel{fill:#f5f9ff;stroke:#c9d7e9;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.redCard{fill:#fff8f6;stroke:#e6cbc4}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.subtitle{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#516072}.section{font:800 28px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 17px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 15px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.tag{font:800 16px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.oline{stroke:#f47d22;stroke-width:4;fill:none;marker-end:url(#oarrow)}.pline{stroke:#6045a9;stroke-width:4;fill:none;marker-end:url(#parrow)}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
    <marker id="oarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f47d22"/></marker>
    <marker id="parrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6045a9"/></marker>
  </defs>

  <rect class="bg" width="1920" height="1280"/>
  <rect class="bluePanel shadow" x="50" y="34" width="1820" height="128" rx="24"/>
  <text class="title" x="665" y="95">Skills 自进化总体链路</text>
  <text class="subtitle" x="574" y="130">检索召回 -> 用户反馈 -> 候选抽取 -> add / merge / discard -> 审计治理 -> 后续复用</text>

  <rect class="panel shadow" x="70" y="205" width="1780" height="245" rx="22"/>
  <text class="section" x="112" y="255">一、在线使用链路</text>
  <g transform="translate(120,300)">
    <rect class="card blueCard" width="210" height="112" rx="16"/>
    <text class="label" x="58" y="45">用户输入</text>
    <text class="small" x="42" y="78">当前任务请求</text>
  </g>
  <g transform="translate(405,300)">
    <rect class="card purpleCard" width="230" height="112" rx="16"/>
    <text class="label" x="52" y="45">Skill 检索</text>
    <text class="small" x="40" y="78">BM25-lite top 3</text>
  </g>
  <g transform="translate(715,300)">
    <rect class="card greenCard" width="250" height="112" rx="16"/>
    <text class="label" x="42" y="45">retrieved_skills</text>
    <text class="small" x="42" y="78">注入本轮上下文</text>
  </g>
  <g transform="translate(1045,300)">
    <rect class="card orangeCard" width="245" height="112" rx="16"/>
    <text class="label" x="54" y="45">Agent 回复</text>
    <text class="small" x="38" y="78">可选择调用 skill</text>
  </g>
  <g transform="translate(1370,300)">
    <rect class="card greenCard" width="260" height="112" rx="16"/>
    <text class="label" x="44" y="45">pending window</text>
    <text class="small" x="36" y="78">保存最近对话窗口</text>
  </g>
  <path class="gline" d="M330 356H405"/>
  <path class="gline" d="M635 356H715"/>
  <path class="gline" d="M965 356H1045"/>
  <path class="gline" d="M1290 356H1370"/>

  <rect class="panel shadow" x="70" y="500" width="1135" height="535" rx="22"/>
  <text class="section" x="112" y="550">二、在线沉淀决策链路</text>
  <g transform="translate(125,595)">
    <rect class="card blueCard" width="230" height="116" rx="16"/>
    <text class="label" x="48" y="45">下一轮反馈</text>
    <text class="small" x="34" y="80">作为上一轮证据</text>
  </g>
  <g transform="translate(445,595)">
    <rect class="card purpleCard" width="230" height="116" rx="16"/>
    <text class="label" x="48" y="45">online_ingest</text>
    <text class="small" x="46" y="80">沉淀统一入口</text>
  </g>
  <g transform="translate(765,595)">
    <rect class="card greenCard" width="230" height="116" rx="16"/>
    <text class="label" x="66" y="45">Extractor</text>
    <text class="small" x="34" y="80">最多抽 1 个候选</text>
  </g>
  <g transform="translate(445,760)">
    <rect class="card orangeCard" width="285" height="122" rx="16"/>
    <text class="label" x="82" y="48">Maintainer</text>
    <text class="small" x="42" y="84">判断 add / merge / discard</text>
  </g>
  <g transform="translate(840,895)">
    <rect class="card redCard" width="235" height="105" rx="16"/>
    <text class="label" x="76" y="48">discard</text>
    <text class="small" x="40" y="78">重复或低价值</text>
  </g>
  <g transform="translate(125,895)">
    <rect class="card greenCard" width="235" height="105" rx="16"/>
    <text class="label" x="94" y="48">add</text>
    <text class="small" x="34" y="78">创建新 SKILL.md</text>
  </g>
  <g transform="translate(445,895)">
    <rect class="card purpleCard" width="285" height="105" rx="16"/>
    <text class="label" x="106" y="48">merge</text>
    <text class="small" x="42" y="78">演化已有 SKILL.md</text>
  </g>
  <path class="oline" d="M1630 412V474H240V595"/>
  <path class="gline" d="M355 653H445"/>
  <path class="gline" d="M675 653H765"/>
  <path class="gline" d="M880 711V740H588V760"/>
  <path class="gline" d="M520 882V947H360"/>
  <path class="pline" d="M588 882V895"/>
  <path class="line" d="M730 821H800V947H840"/>

  <rect class="panel shadow" x="1260" y="500" width="590" height="535" rx="22"/>
  <text class="section" x="1302" y="550">三、审计与治理产物</text>
  <g transform="translate(1310,595)">
    <rect class="card greenCard" width="220" height="105" rx="16"/>
    <text class="label" x="52" y="42">SKILL.md</text>
    <text class="small" x="32" y="74">项目级或用户级</text>
  </g>
  <g transform="translate(1585,595)">
    <rect class="card purpleCard" width="220" height="105" rx="16"/>
    <text class="label" x="66" y="42">history</text>
    <text class="small" x="34" y="74">演化前完整快照</text>
  </g>
  <g transform="translate(1310,770)">
    <rect class="card orangeCard" width="220" height="105" rx="16"/>
    <text class="label" x="48" y="42">provenance</text>
    <text class="small" x="26" y="74">来源和决策回溯</text>
  </g>
  <g transform="translate(1585,770)">
    <rect class="card blueCard" width="220" height="105" rx="16"/>
    <text class="label" x="54" y="42">usage stats</text>
    <text class="small" x="30" y="74">检索和使用统计</text>
  </g>
  <path class="gline" d="M242 895V735H1280V648H1310"/>
  <path class="pline" d="M588 1000V1020H1225V648H1585"/>
  <path class="line" d="M1075 947H1240V822H1310"/>
  <path class="pline" d="M1530 648H1585"/>
  <path class="line" d="M1530 822H1585"/>

  <rect class="panel shadow" x="70" y="1080" width="1780" height="140" rx="22"/>
  <text class="section" x="112" y="1128">四、后续复用和质量反馈</text>
  <g transform="translate(430,1148)">
    <rect class="card blueCard" width="270" height="58" rx="14"/>
    <text class="small" x="32" y="37">Skill cache reset 后刷新 Prompt</text>
  </g>
  <g transform="translate(820,1148)">
    <rect class="card greenCard" width="270" height="58" rx="14"/>
    <text class="small" x="38" y="37">后续请求继续检索召回</text>
  </g>
  <g transform="translate(1210,1148)">
    <rect class="card orangeCard" width="270" height="58" rx="14"/>
    <text class="small" x="26" y="37">长期 retrieved 未 used 可归档</text>
  </g>
  <path class="gline" d="M1530 648V1060H700V1177H820"/>
  <path class="line" d="M1805 822V1060H1370V1148"/>
  <text class="muted" x="640" y="1252">核心边界：只把可复用方法沉淀为 Skill；一次性内容、隐私、临时项目事实不进入 SKILL.md。</text>
</svg>
