<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs><style>.bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.line{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#arrow)}.shadow{filter:url(#shadow)}</style><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker></defs>
  <rect class="bg" width="1920" height="1280"/>
  <text class="title" x="650" y="88">Skills 自进化架构</text>
  <rect class="panel shadow" x="90" y="150" width="1740" height="960" rx="24"/>
  <g transform="translate(160,250)"><rect class="card blueCard" width="250" height="130" rx="18"/><text class="label" x="62" y="52">第 N 轮任务</text><text class="small" x="48" y="88">用户输入 + 回复</text></g>
  <g transform="translate(500,250)"><rect class="card greenCard" width="250" height="130" rx="18"/><text class="label" x="38" y="52">pending window</text><text class="small" x="46" y="88">保存对话窗口</text></g>
  <g transform="translate(840,250)"><rect class="card orangeCard" width="250" height="130" rx="18"/><text class="label" x="52" y="52">第 N+1 轮</text><text class="small" x="38" y="88">用户反馈作为证据</text></g>
  <g transform="translate(1180,250)"><rect class="card purpleCard" width="250" height="130" rx="18"/><text class="label" x="58" y="52">online_ingest</text><text class="small" x="44" y="88">在线沉淀入口</text></g>
  <g transform="translate(1520,250)"><rect class="card greenCard" width="250" height="130" rx="18"/><text class="label" x="70" y="52">Extractor</text><text class="small" x="38" y="88">最多抽 1 个候选</text></g>
  <g transform="translate(500,560)"><rect class="card orangeCard" width="280" height="140" rx="18"/><text class="label" x="70" y="56">Maintainer</text><text class="small" x="38" y="94">add / merge / discard</text></g>
  <g transform="translate(900,560)"><rect class="card greenCard" width="280" height="140" rx="18"/><text class="label" x="76" y="56">SKILL.md</text><text class="small" x="48" y="94">创建或演化</text></g>
  <g transform="translate(1300,560)"><rect class="card blueCard" width="280" height="140" rx="18"/><text class="label" x="72" y="56">审计记录</text><text class="small" x="36" y="94">provenance / stats</text></g>
  <g transform="translate(760,850)"><rect class="card purpleCard" width="400" height="130" rx="18"/><text class="label" x="122" y="54">后续复用</text><text class="small" x="74" y="90">检索注入并按 when-to-use 调用</text></g>
  <path class="line" d="M410 315H500"/><path class="line" d="M750 315H840"/><path class="line" d="M1090 315H1180"/><path class="line" d="M1430 315H1520"/><path class="line" d="M1645 380V500H640V560"/><path class="line" d="M780 630H900"/><path class="line" d="M1180 630H1300"/><path class="line" d="M1040 700V850"/>
  <text class="section" x="710" y="1050">核心差异：不是无约束自改 prompt，而是有证据、有权限、有审计的 Skills 演化</text>
</svg>

