<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1220" viewBox="0 0 1920 1220">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.blue{fill:#3165b7}.green{fill:#14945b}.orange{fill:#f47d22}.purple{fill:#6045a9}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1220"/>
  <text class="title" x="700" y="90">Skills 概念与执行流程</text>
  <rect class="panel shadow" x="80" y="150" width="1760" height="920" rx="24"/>

  <rect class="card purpleCard" x="150" y="230" width="370" height="230" rx="18"/>
  <text class="section" x="250" y="280">Skill 是什么</text>
  <text class="small" x="190" y="326">一个带 frontmatter 的 SKILL.md</text>
  <text class="small" x="190" y="364">保存可复用方法、偏好和流程</text>
  <text class="small" x="190" y="402">不是一次性任务内容或项目事实</text>

  <g transform="translate(650,230)"><rect class="card blueCard" width="270" height="130" rx="18"/><circle class="blue" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">发现</text><text class="small" x="42" y="88">用户级 + 项目级</text></g>
  <g transform="translate(1030,230)"><rect class="card greenCard" width="270" height="130" rx="18"/><circle class="green" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">检索</text><text class="small" x="42" y="88">BM25-lite 匹配请求</text></g>
  <g transform="translate(1410,230)"><rect class="card orangeCard" width="270" height="130" rx="18"/><circle class="orange" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">注入</text><text class="small" x="42" y="88">retrieved_skills 上下文</text></g>
  <path class="line" d="M920 295H1030"/>
  <path class="line" d="M1300 295H1410"/>

  <g transform="translate(650,520)"><rect class="card greenCard" width="270" height="130" rx="18"/><circle class="green" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">调用</text><text class="small" x="42" y="88">skill 工具按名称执行</text></g>
  <g transform="translate(1030,520)"><rect class="card purpleCard" width="270" height="130" rx="18"/><circle class="purple" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">inline</text><text class="small" x="42" y="88">Prompt 回到主 Agent</text></g>
  <g transform="translate(1410,520)"><rect class="card blueCard" width="270" height="130" rx="18"/><circle class="blue" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">fork</text><text class="small" x="42" y="88">启动隔离子 Agent</text></g>
  <path class="gline" d="M1545 360V520"/>
  <path class="line" d="M920 585H1030"/>
  <path class="line" d="M1300 585H1410"/>

  <rect class="card" x="260" y="790" width="1400" height="120" rx="18"/>
  <text class="section" x="810" y="840">可进化</text>
  <text class="small" x="360" y="882">当用户给出明确、稳定、未来可复用的反馈时，mawoagent 可以新增 Skill 或合并进已有 Skill，并保存版本快照和来源记录。</text>
</svg>
