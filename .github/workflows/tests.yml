name: Offline runtime tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA: a moved tag would otherwise change what runs
      # with repository read access. Comments carry the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -q > test-output.txt 2>&1
      - if: failure()
        shell: bash
        run: |
          echo "### Test output (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 test-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAIL|ERROR):' test-output.txt | while IFS= read -r line; do
            echo "::error title=Test failure::$line"
          done
          python - <<'PY'
          import re
          text = open('test-output.txt', encoding='utf-8', errors='replace').read()
          for block in re.split(r'\n={70}\n', text):
              lines = block.strip().splitlines()
              if lines and lines[0].startswith(('FAIL:', 'ERROR:')):
                  head = lines[0][:120]
                  msg = '%0A'.join(line.replace('%', '%25') for line in lines[:30])
                  print(f'::error title={head}::{msg}')
          PY
      - run: git diff --check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # Pinned: a new ruff release adds rules, and a lint gate that changes
      # under you is a gate people disable.
      - run: python -m pip install --disable-pip-version-check ruff==0.17.3
      - run: python -m ruff check .
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --test web/tests/*.test.mjs
